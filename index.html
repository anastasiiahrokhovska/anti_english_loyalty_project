<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyalty Card & Booking</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --pink-bg: #f3a8bf;
            --pink-light: #fcd5e0;
            --pink-btn: #eb87a2;
            --green-card: #0d2818;
            --dark-form: #1e2d24;
            --input-bg: #142018;
            --text-light: #ffffff;
            --text-dark: #000000;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #050b07;
            color: var(--text-light);
            margin: 0;
            padding: 16px 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .pink-card {
            background-color: var(--pink-bg);
            border-radius: 20px;
            padding: 20px 16px;
            text-align: center;
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .pink-card h1 {
            font-size: 20px;
            margin: 0 0 6px 0;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .pink-card .subtitle {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 18px;
            line-height: 1.3;
        }

        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
            padding: 0 8px;
        }

        .stamp-circle {
            aspect-ratio: 1;
            border: 2px dashed #d1758f;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #8c3b52;
        }

        .stamp-circle.active {
            border: 2px solid #8c3b52;
            background-color: #8c3b52;
            color: #fff;
        }

        .stamp-circle.free {
            border: 2px solid #e2587b;
            color: #e2587b;
            font-size: 11px;
            background-color: #fce8ef;
        }

        .pink-badge {
            background-color: var(--pink-light);
            border-radius: 20px;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            color: var(--text-dark);
        }

        .green-card {
            background-color: var(--green-card);
            border-radius: 20px;
            padding: 20px 16px;
            color: #e0e0e0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .green-card h2 {
            text-align: center;
            font-size: 18px;
            margin: 0 0 16px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #a0b0a5;
            font-weight: 500;
        }

        .info-value {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
        }

        .form-card {
            background-color: var(--dark-form);
            border-radius: 20px;
            padding: 20px 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .form-card h3 {
            font-size: 14px;
            margin: 0 0 14px 0;
            color: #ffffff;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #a0b0a5;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background-color: var(--input-bg);
            color: #ffffff;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
        }

        select option {
            background-color: #142018;
            color: #ffffff;
        }

        .btn-pink {
            width: 100%;
            padding: 14px;
            background-color: var(--pink-btn);
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn-pink:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="pink-card">
        <h1>ANEI ENGLISH</h1>
        <div class="subtitle">Беручи участь у 7 розсилках, отримуйте 8-му<br>БЕЗКОШТОВНО!</div>
        <div class="stamps-grid" id="stampsGrid"></div>
        <div class="pink-badge">Зберіть 7 штампів — 8-ма розсилка за наш рахунок!</div>
    </div>

    <div class="green-card">
        <h2>ANEI ENGLISH</h2>
        <div class="info-row">
            <span class="info-label">Адмін / Зв'язок:</span>
            <a href="https://t.me/AnHrok" target="_blank" class="info-value">@AnHrok</a>
        </div>
        <div class="info-row">
            <span class="info-label">Канал:</span>
            <a href="https://t.me/anei_english" target="_blank" class="info-value">@anei_english</a>
        </div>
        <div class="info-row">
            <span class="info-label">Відгуки:</span>
            <a href="https://t.me/anei_english_lessondelivery" target="_blank" class="info-value">@anei_english_lessondelivery</a>
        </div>
        <div class="info-row">
            <span class="info-label">Бот:</span>
            <a href="https://t.me/AneiEnglishbot" target="_blank" class="info-value">@AneiEnglishbot</a>
        </div>
    </div>

    <div class="form-card">
        <h3>Забронювати участь у розсилці</h3>
        
        <div class="form-group">
            <label for="channelInput">Посилання на ваш канал / блог</label>
            <input type="text" id="channelInput" placeholder="https://t.me/your_channel або @your_channel" required>
        </div>

        <div class="form-group">
            <label for="bundleSelect">Найближча розсилка</label>
            <select id="bundleSelect" onchange="updateTopics()">
                <option value="">-- Оберіть розсилку --</option>
                <option value="AUTUMN MOVIES & SERIES">🎬 AUTUMN MOVIES & SERIES (25.10–31.10) — 60 грн</option>
                <option value="MAIN CHARACTER ENERGY">💋 MAIN CHARACTER ENERGY (19–23.10) — 40 грн</option>
            </select>
        </div>

        <div class="form-group">
            <label for="topicSelect">Вільні теми</label>
            <select id="topicSelect">
                <option value="">-- Спочатку оберіть розсилку --</option>
            </select>
        </div>

        <button class="btn-pink" onclick="processBooking()">Оплатити та забронювати</button>
    </div>
</div>

<script>
    // ВАШІ КЛЮЧІ FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyBY1zvXD7BxgzAcwZMJ13niqNRAC9UKE_Q",
        authDomain: "aneienglishloyaltyproject.firebaseapp.com",
        databaseURL: "https://aneienglishloyaltyproject-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "aneienglishloyaltyproject",
        storageBucket: "aneienglishloyaltyproject.firebasestorage.app",
        messagingSenderId: "689223712800",
        appId: "1:689223712800:web:ff4d0271436d6c8b3fc45"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ПОСИЛАННЯ НА ВАШУ МОНОБАНКУ
    const MONOBANK_LINK = "https://send.monobank.ua/jar/3NdgaE1Lzq";

    const tg = window.Telegram ? window.Telegram.WebApp : null;

    const ALL_TOPICS = {
        "AUTUMN MOVIES & SERIES": [
            "🍂 Gilmore Girls", "🎀 Gossip Girl", "🍎 Twilight", "🪄 Harry Potter",
            "☂️ Wednesday", "🩸 The Vampire Diaries", "🛋 Friends", "📖 Dead Poets Society",
            "👠 The Devil Wears Prada", "🔎 Knives Out", "👒 Anne with an E", "🕯 Practical Magic",
            "🍁 When Harry Met Sally", "🔘 Coraline", "🕵️ Sherlock Holmes", "✂️ Edward Scissorhands",
            "📚 Little Women", "✨ Запропонувати власну тему"
        ],
        "MAIN CHARACTER ENERGY": [
            "💋 Main Character Syndrome", "✨ Romanticize Your Life / Romantiser sa vie",
            "🚩 Red & Green Flags", "💅 That Girl Era", "👑 Confidence Without the Cringe / Confiance en soi",
            "💔 Friendship Breakups", "📱 Social Media vs Real Life", "🌱 Reinventing Yourself",
            "💌 L’amour à la française", "🗼 La vie parisienne", "✨ Запропонувати власну тему"
        ]
    };

    let takenTopics = [];

    // Автоматичне отримання зайнятих тем з бази у реальному часі
    database.ref("taken_topics").on("value", (snapshot) => {
        const data = snapshot.val();
        takenTopics = data ? Object.values(data) : [];
        updateTopics();
    });

    function updateTopics() {
        const bundle = document.getElementById("bundleSelect").value;
        const topicSelect = document.getElementById("topicSelect");
        topicSelect.innerHTML = "";

        if (!bundle || !ALL_TOPICS[bundle]) {
            topicSelect.innerHTML = '<option value="">-- Спочатку оберіть розсилку --</option>';
            return;
        }

        const available = ALL_TOPICS[bundle].filter(t => !takenTopics.includes(t));

        if (available.length === 0) {
            topicSelect.innerHTML = '<option value="">-- Усі теми вже заброньовані --</option>';
            return;
        }

        available.forEach(topic => {
            const opt = document.createElement("option");
            opt.value = topic;
            opt.textContent = topic;
            topicSelect.appendChild(opt);
        });
    }

    function renderStamps(count = 0) {
        const grid = document.getElementById("stampsGrid");
        if (!grid) return;
        grid.innerHTML = "";
        for (let i = 1; i <= 8; i++) {
            const slot = document.createElement("div");
            slot.className = "stamp-circle";
            if (i <= count) slot.classList.add("active");
            if (i === 8) {
                slot.classList.add("free");
                slot.textContent = "FREE";
            } else {
                slot.textContent = i <= count ? "✓" : "";
            }
            grid.appendChild(slot);
        }
    }

    function loadUserStamps() {
        if (tg && tg.CloudStorage) {
            tg.CloudStorage.getItem("user_stamps", (err, value) => {
                renderStamps(value ? parseInt(value) : 0);
            });
        } else {
            renderStamps(0);
        }
    }

    function processBooking() {
        const channel = document.getElementById("channelInput").value.trim();
        const bundle = document.getElementById("bundleSelect").value;
        const topic = document.getElementById("topicSelect").value;

        if (!channel || !bundle || !topic) {
            alert("Будь ласка, вкажіть посилання на канал та оберіть тему!");
            return;
        }

        // Автоматично викреслюємо тему для всіх користувачів
        if (topic !== "✨ Запропонувати власну тему") {
            database.ref("taken_topics").push(topic);
        }

        const dataToSend = {
            action: "booking",
            channel: channel,
            bundle: bundle,
            topic: topic
        };

        if (tg && tg.sendData) {
            tg.sendData(JSON.stringify(dataToSend));
        }

        // Перенаправлення на Монобанку з коментарем
        const comment = encodeURIComponent(`${channel} | ${topic}`);
        const payUrl = `${MONOBANK_LINK}?text=${comment}`;

        if (tg && tg.openLink) {
            tg.openLink(payUrl);
        } else {
            window.location.href = payUrl;
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        if (tg) {
            tg.expand();
        }
        loadUserStamps();
    });
</script>
</body>
</html>
