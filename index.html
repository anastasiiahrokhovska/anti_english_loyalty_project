<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANEI ENGLISH - Loyalty & Bookings</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --accent-color: #8b5e3c;
            --accent-hover: #6f472c;
            --text-color: #2c2c2c;
            --gray-light: #f0ebe1;
            --gray-text: #7a7a7a;
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 24px 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            margin: 0;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .header p {
            font-size: 13px;
            color: var(--gray-text);
            margin-top: 4px;
        }

        .sketch-card {
            background-color: var(--gray-light);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 24px;
            text-align: center;
        }

        .sketch-card h2 {
            font-size: 15px;
            margin: 0 0 14px 0;
            color: var(--text-color);
        }

        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .stamp-slot {
            aspect-ratio: 1;
            background-color: #fff;
            border: 2px dashed #d1c7b7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--gray-text);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .stamp-slot.active {
            border: 2px solid var(--accent-color);
            background-color: var(--accent-color);
            color: #fff;
        }

        .stamp-slot.free-slot {
            border-color: #d4af37;
            color: #d4af37;
            font-size: 11px;
        }

        .booking-section h3 {
            font-size: 16px;
            margin: 0 0 16px 0;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        select, input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0d8cc;
            border-radius: 10px;
            font-size: 14px;
            background-color: #faf8f5;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent-color);
            background-color: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>ANEI ENGLISH</h1>
        <p>Персональна картка лояльності та бронювання</p>
    </div>

    <!-- Скетч-карта -->
    <div class="sketch-card">
        <h2>Ваша картка лояльності (7+1 FREE)</h2>
        <div class="stamps-grid" id="stampsGrid"></div>
        <p style="font-size: 11px; color: #666; margin: 0;">7 оплачених розсилок = 8-ма в подарунок!</p>
    </div>

    <!-- Бронювання -->
    <div class="booking-section">
        <h3>Забронювати тему на розсилку</h3>
        
        <div class="form-group">
            <label for="channelInput">Ваш Telegram-канал або Юзернейм:</label>
            <input type="text" id="channelInput" placeholder="@my_channel_name" required>
        </div>

        <div class="form-group">
            <label for="bundleSelect">Оберіть розсилку:</label>
            <select id="bundleSelect" onchange="updateTopics()">
                <option value="">-- Оберіть розсилку --</option>
                <option value="AUTUMN MOVIES & SERIES">🎬 AUTUMN MOVIES & SERIES (25.10–31.10) — 60 грн</option>
                <option value="MAIN CHARACTER ENERGY">💋 MAIN CHARACTER ENERGY (19–23.10) — 40/55 грн</option>
            </select>
        </div>

        <div class="form-group">
            <label for="topicSelect">Оберіть вільну тему:</label>
            <select id="topicSelect">
                <option value="">-- Спочатку оберіть розсилку --</option>
            </select>
        </div>

        <button class="btn-submit" onclick="submitBooking()">Забронювати тему</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const topicsData = {
        "AUTUMN MOVIES & SERIES": [
            "🍂 Gilmore Girls",
            "🎀 Gossip Girl",
            "🍎 Twilight",
            "🪄 Harry Potter",
            "📖 Dead Poets Society",
            "👠 The Devil Wears Prada",
            "🔎 Knives Out",
            "👒 Anne with an E",
            "🍁 When Harry Met Sally",
            "✂️ Edward Scissorhands",
            "📚 Little Women",
            "✨ Запропонувати власну тему"
        ],
        "MAIN CHARACTER ENERGY": [
            "Main Character Syndrome",
            "Romanticize Your Life / Romantiser sa vie",
            "That Girl Era",
            "Confidence Without the Cringe / Confiance en soi",
            "Friendship Breakups",
            "Social Media vs Real Life",
            "Reinventing Yourself",
            "L’amour à la française",
            "La vie parisienne",
            "✨ Запропонувати власну тему"
        ]
    };

    function updateTopics() {
        const bundle = document.getElementById("bundleSelect").value;
        const topicSelect = document.getElementById("topicSelect");
        topicSelect.innerHTML = "";

        if (!bundle || !topicsData[bundle]) {
            topicSelect.innerHTML = '<option value="">-- Спочатку оберіть розсилку --</option>';
            return;
        }

        topicsData[bundle].forEach(topic => {
            const opt = document.createElement("option");
            opt.value = topic;
            opt.textContent = topic;
            topicSelect.appendChild(opt);
        });
    }

    function renderStamps(count = 0) {
        const grid = document.getElementById("stampsGrid");
        grid.innerHTML = "";
        for (let i = 1; i <= 8; i++) {
            const slot = document.createElement("div");
            slot.className = "stamp-slot";
            if (i <= count) slot.classList.add("active");
            if (i === 8) {
                slot.classList.add("free-slot");
                slot.textContent = "FREE";
            } else {
                slot.textContent = i <= count ? "✓" : i;
            }
            grid.appendChild(slot);
        }
    }

    function loadUserStamps() {
        if (tg.CloudStorage) {
            tg.CloudStorage.getItem("user_stamps", (err, value) => {
                const count = value ? parseInt(value) : 0;
                renderStamps(count);
            });
        } else {
            renderStamps(0);
        }
    }

    function submitBooking() {
        const channel = document.getElementById("channelInput").value.trim();
        const bundle = document.getElementById("bundleSelect").value;
        const topic = document.getElementById("topicSelect").value;

        if (!channel || !bundle || !topic) {
            alert("Будь ласка, заповніть усі поля!");
            return;
        }

        const dataToSend = {
            action: "booking",
            channel: channel,
            bundle: bundle,
            topic: topic
        };

        tg.sendData(JSON.stringify(dataToSend));
    }

    loadUserStamps();
</script>

</body>
</html>
